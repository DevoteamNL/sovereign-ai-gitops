apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sovereign-ai-research-vllm-models
  namespace: openshift-gitops
  labels:
    gitops.ownedBy: cluster-config
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "0"
spec:
  destination:
    namespace: sovereign-ai-research
    server: https://kubernetes.default.svc
  project: cluster-config
  source:
    repoURL: https://github.com/DevoteamNL/sovereign-ai-research.git
    targetRevision: rhdp-aws-downsize
    path: deploy/helm/vllm-models
    helm:
      valueFiles:
        - values-aws-gpu-conservative.yaml
      valuesObject:
        global:
          namespace: sovereign-ai-research
        models:
          llama-3-3-70b-fp8:
            tolerations:
              - key: nvidia.com/gpu
                operator: Equal
                value: "true"
                effect: NoSchedule
              - key: gpu-type
                operator: Equal
                value: g6e
                effect: NoSchedule
          nemotron-nano-30b:
            tolerations:
              - key: nvidia.com/gpu
                operator: Equal
                value: "true"
                effect: NoSchedule
              - key: gpu-type
                operator: Equal
                value: g6e
                effect: NoSchedule
          nemotron-mini-4b:
            tolerations:
              - key: nvidia.com/gpu
                operator: Equal
                value: "true"
                effect: NoSchedule
              - key: gpu-type
                operator: Equal
                value: g6
                effect: NoSchedule
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 20m
