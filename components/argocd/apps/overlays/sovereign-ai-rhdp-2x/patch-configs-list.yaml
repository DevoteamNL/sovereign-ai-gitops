apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cluster-configs
spec:
  generators:
  - list:
      elements:
      - cluster: local
        url: https://kubernetes.default.svc
        values:
          name: user-workload-monitoring
          path: components/cluster-configs/user-workload-monitoring/overlays/default
      # Platform-only for now (no AI workload). Add tenants here when ready:
      # - name: sovereign-ai-rag
      #   path: tenants/sovereign-ai-rag
      # - name: rh-research
      #   path: tenants/rh-research
